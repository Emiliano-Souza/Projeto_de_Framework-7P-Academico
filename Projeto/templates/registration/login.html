{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar</title>
  <link rel="stylesheet" href="{% static 'epi/epi.css' %}">
</head>
<body>
  <main class="page" style="max-width: 420px;">
    <section class="panel form-panel">
      <span class="eyebrow">Sistema de EPIs</span>
      <h1 style="font-size: 2rem; margin: 12px 0 24px;">Entrar</h1>

      {% if form.errors %}
        <ul class="error-list">
          <li>Usuário ou senha inválidos. Tente novamente.</li>
        </ul>
      {% endif %}

      {% if next %}
        <ul class="error-list">
          <li>Faça login para continuar.</li>
        </ul>
      {% endif %}

      <form method="post" novalidate>
        {% csrf_token %}
        <div class="form-grid" style="grid-template-columns: 1fr;">
          <div class="field-group">
            <label for="{{ form.username.id_for_label }}">Usuário</label>
            {{ form.username }}
          </div>
          <div class="field-group">
            <label for="{{ form.password.id_for_label }}">Senha</label>
            {{ form.password }}
          </div>
        </div>
        <div class="actions" style="justify-content: flex-end; margin-top: 20px;">
          <button class="button-primary" type="submit">Entrar</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
